spring.application.name=smart-queue-system
server.port=8080

# H2 for development (switch to MySQL for production)
spring.datasource.url=jdbc:h2:mem:sqmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Dinaga2005@

# Prevent Spring from auto-running sql/mysql-schema.sql (MySQL-only script)
spring.sql.init.mode=never

# MySQL (uncomment H2 block above and use these when MySQL is ready)
# spring.datasource.url=jdbc:mysql://localhost:3306/sqms?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.h2.console.enabled=false

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
jwt.secret=SmartQueueManagementSystemSecretKeyForJWTTokenGeneration2026VeryLongKey
jwt.expiration=86400000

# Mail (configure for production)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Queue settings
queue.average-consultation-minutes=5

# CORS
app.cors.allowed-origins=http://localhost:5173
